name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -buildvcs=false ./cmd/rbacviz

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2

  vulnerability:
    name: Vulnerability analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  cross-build:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - run: ./hack/build-all.sh

  installer:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh hack/test-install.sh
      - run: ./hack/test-install.sh

  generated-assets:
    name: Generated documentation assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - run: go run ./hack/render-screenshots
      - run: git diff --exit-code -- docs/assets
