apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: proposed-token-minter
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: proposed-token-minter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: proposed-token-minter
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: alice
